name: Release

# Cut a release with `just release <version>`, then push the tag it prints.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.24
          install_args: --include-task-tools
      - run: mise exec -- just test
      - run: mise exec -- just build
      - name: Verify the musl release binary is fully static
        if: runner.os == 'Linux'
        run: scripts/check-static target/x86_64-unknown-linux-musl/release/git-commitfs
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: mise exec -- scripts/package-release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          rm ./*.sha256
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"

  # Needs a one-time trusted publisher entry on crates.io for this repository
  # and workflow, plus the repository variable PUBLISH_CRATE=true.
  publish-crate:
    needs: release
    if: vars.PUBLISH_CRATE == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.24
          install_args: --include-task-tools
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth
      - run: mise exec -- cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
