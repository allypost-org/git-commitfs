[package]
name = "git-commitfs"
version = "0.1.0"
edition = "2024"
description = "Run commands against a disposable checkout of the Git index"
readme = "README.md"
repository = "https://github.com/allypost-org/git-commitfs"
license = "Apache-2.0"
keywords = ["checkout", "cli", "git", "hooks", "pre-commit"]
categories = ["command-line-utilities", "development-tools"]

# Must match the archive name and layout produced by scripts/package-release.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }.tar.gz"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["fs", "process"] }
signal-hook = "0.4.5"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
errno = "0.3.14"
libproc = "0.14.11"

[lints.clippy]
cognitive_complexity = "allow"
manual_let_else = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_collect = "warn"
no_effect_underscore_binding = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
redundant_type_annotations = "warn"
single_match_else = "allow"
uninlined_format_args = "allow"
unnecessary_debug_formatting = "allow"
unwrap_used = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
