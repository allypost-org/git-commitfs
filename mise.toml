# Keep the mise-action version in CI aligned with this lockfile writer.
min_version = "2026.10.24"

[vars]
rustfmt_toolchain = "nightly-2026-10-30"
build_target = "{{ arch(x64='x86_64', arm64='aarch64') }}-{% if os() == 'macos' %}apple-darwin{% else %}unknown-linux-musl{% endif %}"

[env]
# hk's file discovery must not refresh the original index's stat cache.
GIT_OPTIONAL_LOCKS = "0"
# Keep native macOS builds free of Linux linker flags; explicit targets win.
CARGO_BUILD_TARGET = "{{ get_env(name='CARGO_BUILD_TARGET', default=vars.build_target) }}"

[tools]
fd = "10.5.0"
hk = "2.10.0"
just = "1.59.0"
pkl = "0.32.2"
rust = { version = "1.99.1", profile = "minimal", components = ["clippy", "rustfmt"], targets = ["x86_64-unknown-linux-musl"] }
tombi = "1.9.7"
watchexec = "2.8.0"

[tasks.nightly-rustfmt]
hide = true
tools.rust = { version = "{{ vars.rustfmt_toolchain }}", profile = "minimal", components = ["rustfmt"] }
run = "cargo fmt --all"
